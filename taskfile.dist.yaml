version: 3

tasks:
  render:
    cmds:
      - cmd: python scripts/render.py
      - cmd: dprint fmt

  build:
    cmd: |
      rattler-build build \
        --wrap-log-lines=false \
        --log-style=plain \
        --channel=conda-forge \
        --channel=https://prefix.dev/trim21-pkgs \
        --recipe-dir=packages
