name: oci-mirror

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"
  workflow_run:
    workflows:
      - release
    types:
      - completed

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:
  mirror:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: astral-sh/setup-uv@v10.4.0

      # trim21 fork of channel-mirrors/conda-oci-mirror, branch channel-urls:
      # allow a full channel URL (prefix.dev) as the mirror source; the
      # upstream CLI only supports anaconda.org channels. Tracked by branch
      # so fork fixes land without a pin bump here.
      - run: uv tool install "git+https://github.com/trim21/conda-oci-mirror.git@channel-urls"

      # the channel may still be publishing when release finishes; give
      # prefix.dev time to settle before reading repodata and shards
      - name: wait for channel to settle
        if: github.event_name == 'workflow_run'
        run: sleep 60

      - name: mirror to ghcr
        env:
          ORAS_USER: trim21
          ORAS_PASS: "${{ github.token }}"
        run: >
          conda-oci mirror
          --channel https://repo.prefix.dev/trim21-pkgs
          --registry ghcr.io/trim21/personal-feedstock
          --subdir linux-64
          --subdir noarch
          --cache-dir "${RUNNER_TEMP}/conda-oci-mirror"

      # packages pushed by the mirror start private; visibility changes need
      # a classic PAT with write:packages, which github.token cannot provide
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: make new ghcr packages public
        env:
          GITHUB_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "GHCR_PAT secret not set; new packages stay private"
            exit 0
          fi
          uv run scripts/ghcr_public.py
