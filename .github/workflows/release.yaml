name: release

on:
  push:
    branches:
      - "master"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # sleep some time before we build packages.
  # channel may still be processing newly uploaded package
  # give them some time,
  # so rattler-build can see packages in repodata.json
  sleep:
    runs-on: "ubuntu-slim"
    steps:
      - run: sleep 60

  conda:
    needs: sleep
    uses: ./.github/workflows/_build_conda.yaml

  upload-conda:
    name: Upload packages to Conda
    needs: [conda]
    permissions:
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: conda-*
          path: dist
          merge-multiple: true

      - name: Install rattler-build
        uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: prefix-dev/rattler-build
          tag: v0.75.0
        env:
          GITHUB_TOKEN: "${{ github.token }}"

      - run: |
          find ./dist/ -type f -name '*.conda' -print0 | xargs -r0 rattler-build upload prefix -c trim21-pkg
